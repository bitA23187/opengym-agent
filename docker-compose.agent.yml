# Explicit file selection prevents accidentally using upstream prebuilt app images.
name: opengym-agent
services:
  api:
    image: opengym-agent-api:${OPENGYM_IMAGE_TAG:-agent-v0.1.0}
    build:
      context: .
      dockerfile: deploy/agent-api.Dockerfile
    restart: unless-stopped
    init: true
    env_file: agent.env
    environment:
      PORT: "3000"
      DATA_DIR: /data
      TRUST_PROXY: "1"
      COACH_DISABLED: "1"
    volumes:
      - ./data:/data
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
  web:
    image: opengym-agent-web:${OPENGYM_IMAGE_TAG:-agent-v0.1.0}
    build:
      context: .
      dockerfile: deploy/agent-web.Dockerfile
      args:
        APP_BUILD: ${OPENGYM_IMAGE_TAG:-agent-v0.1.0}
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "${OPENGYM_BIND_ADDRESS:-127.0.0.1}:${OPENGYM_WEB_PORT:-8080}:8080"
    environment:
      NGINX_PORT: "8080"
      BACKEND: api
      PORT: "3000"
      RESOLVER: 127.0.0.11
      BASE_PATH: ""
      MEDIA_UPLOAD_MAX: 48m
      CF_CONNECTING_IP: ""
    healthcheck:
      test: [CMD-SHELL, "wget --spider -q http://127.0.0.1:8080/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
