# Legacy example; replace the connector subnet before use.
# Production only: loaded in nginx's http context before the generated server block.
# cloudflared's address is fixed on the dedicated opengym_ingress bridge.
set_real_ip_from 172.30.0.2;
real_ip_header CF-Connecting-IP;
real_ip_recursive off;

# Empty keys aren't counted: media sync, workout saves and health probes are unaffected.
map $uri $gym_auth_key {
    default "";
    ~^/api/(login|register|pair|device-link)/ $binary_remote_addr;
}
limit_req_zone $gym_auth_key zone=gym_auth:1m rate=10r/m;
limit_req zone=gym_auth burst=10 nodelay;
limit_req_status 429;
limit_req_log_level warn;

map $uri $gym_api_key {
    default "";
    ~^/api/ $binary_remote_addr;
}
limit_conn_zone $gym_api_key zone=gym_connections:1m;
limit_conn gym_connections 24;
limit_conn_status 429;
